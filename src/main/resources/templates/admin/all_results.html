<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Student Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>All Results for My Students</h2>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Student</th>
                        <th>Exam</th>
                        <th>Score</th>
                        <th>Submitted At</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(results)}">
                        <td colspan="4" class="text-center p-4 text-muted">
                            <i class="bi bi-file-earmark-x fs-1 d-block mb-2"></i>
                            No exam results found for any of your students yet.
                        </td>
                    </tr>
                    <tr th:each="result : ${results}">
                        <td class="ps-4 fw-bold" th:text="${result.student.fullName}">Student Name</td>
                        <td th:text="${result.exam.title}">Exam Name</td>
                        <td>
                            <span class="badge" 
                                  th:classappend="${(result.scoreAchieved * 100.0 / result.totalMarks) >= 50 ? 'bg-success' : 'bg-danger'}"
                                  th:text="${result.scoreAchieved + ' / ' + result.totalMarks}">
                                10 / 20
                            </span>
                        </td>
                        <td th:text="${#temporals.format(result.submissionTime, 'dd MMM yyyy, HH:mm')}">Date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
